version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch dev-tooling minor/patch bumps into one PR
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Batch non-major runtime bumps; majors (e.g. @atproto/api) stay separate
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  # GitHub Actions pins (checkout@v4, setup-node@v4, etc.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
