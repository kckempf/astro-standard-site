name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write   # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Ensure npm 11.5.1+ for trusted publishing.
      - name: Update npm
        run: npm install -g npm@^latest
        
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Run tests
        run: npm test
        
      # No NODE_AUTH_TOKEN needed - uses OIDC!
      # Access is set via publishConfig in package.json.
      - name: Publish to npm
        run: npm publish
